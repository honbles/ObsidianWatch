# ObsidianWatch — Unified Stack
#
# Starts everything with one command:
#   docker compose up -d --build
#
# Optional: set BACKEND_DOMAIN if agents should connect via domain name
# e.g. BACKEND_DOMAIN=siem.company.com
#
# Everything else is automatic — certs, IPs, and Agent Builder pre-fill.

services:

  # ── Certificate Init ─────────────────────────────────────────────────────────
  # Runs once on first start. Generates CA + server cert with auto-detected IPs.
  # Skipped on subsequent starts if certs already exist.
  cert-init:
    build:
      context: cert-init
      dockerfile: Dockerfile
    container_name: obsidianwatch-cert-init
    environment:
      HOST_IP: "${HOST_IP}"         # required — set in .env or pass on CLI
      BACKEND_DOMAIN: "${BACKEND_DOMAIN:-}"
      EXTRA_SAN_DNS: "${EXTRA_SAN_DNS:-}"   # comma-separated DNS names to add to the self-signed cert
    volumes:
      - certs:/certs
      - ca-private:/ca-private   # CA private key: mounted ONLY here
    restart: "no"

  # ── TimescaleDB ─────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: obsidianwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       obsidianwatch
      POSTGRES_USER:     obsidianwatch
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    # M-09: no published port — DB is reached over the internal compose
    # network only; it was previously exposed on the host's 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidianwatch -d obsidianwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - obsidianwatch

  # ── Agent Backend (:8443) ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    container_name: obsidianwatch-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      cert-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}"
      AGENT_API_KEY: "${AGENT_API_KEY:?AGENT_API_KEY must be set (openssl rand -hex 32), see .env.example}"
    ports:
      - "8443:8443"
    volumes:
      - ./backend/docker/server.yaml:/app/server.yaml
      - certs:/app/certs:ro
      - restart-signal:/var/run/obsidianwatch  # M-08: file-mtime restart signal, replaces docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - obsidianwatch

  # ── Management API (:8443 HTTPS) ─────────────────────────────────────────────
  mgmt-api:
    build:
      context: .
      dockerfile: management/docker/Dockerfile
    container_name: obsidianwatch-mgmt-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      cert-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "8444:8443"
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (openssl rand -hex 32), see .env.example}"
      AGENT_API_KEY: "${AGENT_API_KEY:?AGENT_API_KEY must be set (openssl rand -hex 32), see .env.example}"
      OW_SECRET_KEY: "${OW_SECRET_KEY:?set OW_SECRET_KEY in .env}"   # M-12/CC-07: encrypts stored connector credentials + API keys. BACK THIS UP.
      OW_ALLOWED_ORIGINS: "${OW_ALLOWED_ORIGINS:-}"   # M-10: extra browser origins allowed to open WebSockets
    volumes:
      - ./management/docker/server.yaml:/app/server.yaml
      - ./backend/docker/server.yaml:/app/backend-server.yaml
      - certs:/app/certs:ro
      - agent-cache:/var/lib/obsidianwatch/agent-cache
      - restart-signal:/var/run/obsidianwatch  # M-08: file-mtime restart signal, replaces docker.sock
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp6 2>/dev/null | grep -q 20FB || cat /proc/net/tcp 2>/dev/null | grep -q 20FB || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - obsidianwatch

  # ── Management UI (:443 HTTPS + :80 redirect) ───────────────────────────────
  mgmt-ui:
    build:
      context: management/frontend
      dockerfile: Dockerfile
    container_name: obsidianwatch-mgmt-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
    depends_on:
      mgmt-api:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    networks:
      - obsidianwatch

volumes:
  timescale_data:
  certs:          # TLS certificates — generated by cert-init on first run
  ca-private:     # CA private key — mounted only into cert-init
  agent-cache:    # Compiled agent binaries
  restart-signal: # file-mtime restart signal between mgmt-api and backend

networks:
  obsidianwatch:
    driver: bridge
