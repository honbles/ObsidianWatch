agent:
  id: ""           # Auto-detected from hardware UUID if empty
  version: "0.3.1"

forwarder:
  backend_url: "https://192.168.1.140:8443"
  management_url: "https://192.168.1.140"
  ca_file: "certs/ca.crt"       # Path to backend CA cert (for TLS verification)
  api_key: "changeme"           # API key — set to match backend config
  install_key: ""               # Set automatically during install
  batch_size: 200
  flush_interval: 5s

queue:
  db_path: "/var/lib/obsidianwatch/queue"
  max_rows: 100000

collector:
  syslog:
    enabled: true               # macOS Unified Log stream (auth, SSH, sudo, launchd)

  process:
    enabled: true
    poll_interval: 2s           # sysctl KERN_PROC_ALL poll interval

  network:
    enabled: true
    poll_interval: 30s          # netstat diff interval

  dns:
    enabled: true               # lsof port 53 detection

  fim:
    enabled: true
    dirs:
      - path: /usr/bin
        recursive: false
      - path: /usr/sbin
        recursive: false
      - path: /usr/local/bin
        recursive: false
      - path: /bin
        recursive: false
      - path: /sbin
        recursive: false
      - path: /private/tmp
        recursive: false
        exclude: ["*.log", "*.tmp"]
      - path: /tmp
        recursive: false

  config_monitor:
    enabled: true               # Watches sensitive macOS paths (equiv. to Windows registry)
    paths:
      - /etc/passwd
      - /etc/sudoers
      - /etc/sudoers.d
      - /etc/ssh/sshd_config
      - /etc/hosts
      - /private/etc/passwd
      - /private/etc/sudoers
      - /private/etc/ssh/sshd_config
      - /Library/LaunchDaemons
      - /Library/LaunchAgents
      - /System/Library/LaunchDaemons
      - /root/.ssh
      # A-08: further persistence locations (per-user LaunchAgents and ~/.ssh
      # are discovered automatically under /Users/*)
      - /Library/StartupItems
      - /etc/periodic/daily
      - /etc/periodic/weekly
      - /etc/periodic/monthly
      - /etc/emond.d/rules
      - /usr/lib/cron/tabs
      - /private/var/at/tabs
      - /Library/Preferences/com.apple.loginwindow.plist
      - /etc/zshrc
      - /etc/zprofile
      - /etc/profile
      - /etc/rc.common
      - /private/var/db/com.apple.backgroundtaskmanagement
      - /Library/Scripts

  health:
    enabled: true
    interval: 60s

  rate_limit:
    enabled: true
    max_per_second: 500
    dedupe_window: 5s

log:
  level: "info"                 # debug | info | warn | error
  format: "json"

# Remote analyst shell. Off by default; enable only where you accept remote command execution.
live_response:
  enabled: false
