# HTTP → HTTPS redirect only; agent tunnels are served on 443 (wss) exclusively
server {
    listen 80;
    server_name _;

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # TLS — certs mounted from Docker volume at /etc/nginx/certs/
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live Response agent tunnel — WebSocket
    location /api/v1/live-response/agent-tunnel {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Live Response terminal — WebSocket
    location /api/v1/live-response/terminal {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # WebSocket event stream
    location /ws/ {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Long-running AI endpoints — extended timeout
    location ~* ^/api/v1/agents/[^/]+/(vuln/analyse|rca)$ {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # All other API requests
    location /api/ {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /auth/ {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass https://mgmt-api:8443;
        proxy_ssl_verify off;
    }
}
