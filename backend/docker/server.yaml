# This file is mounted into the container at /app/server.yaml
# Edit this file, NOT configs/server.yaml (which is the build-time template)

server:
  listen_addr: ":8443"
  tls_cert_file: "certs/server.crt"
  tls_key_file:  "certs/server.key"
  # tls_ca_file: "certs/ca.crt"   # uncomment for mTLS
  read_timeout:  "30s"
  write_timeout: "30s"
  max_batch_size: 1000

database:
  host:     "timescaledb"   # Docker service name - do not change when using compose
  port:     5432
  name:     "obsidianwatch"
  user:     "obsidianwatch"
  password: "changeme"      # ← MUST MATCH POSTGRES_PASSWORD in docker-compose.yml
  ssl_mode: "disable"
  max_open_conns:    25
  max_idle_conns:    10
  conn_max_lifetime: "5m"

auth:

  # Agents authenticate with their own certificate (spec A1-A4); there is no
  # shared API key. The Agent builder embeds an enrollment token; on first
  # start the agent enrolls at /api/v1/enroll and gets a 30-day certificate.
  agent_identity:
    ca_cert_file: "agent-ca/agent-ca.crt"   # created on first start
    ca_key_file:  "agent-ca/agent-ca.key"   # 0600; back it up with the volume
    cert_ttl: "720h"                        # 30 days; agents renew at half life

# Live-response tunnels ride on this port: agents connect here (same
# certificate as ingest) and the WebSocket is passed to the management API.
tunnel:
  management_url: "https://mgmt-api:8443"
  management_ca_file: "certs/ca.crt"      # deployment CA from cert-init
  management_server_name: "127.0.0.1"     # a SAN of the cert-init server certificate
  insecure_skip_verify: false

log:
  level:  "info"
  format: "json"
