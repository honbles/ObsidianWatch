# This file is mounted into the container at /app/server.yaml
# Edit this file, NOT configs/server.yaml (which is the build-time template)

server:
  listen_addr: ":8443"
  tls_cert_file: "certs/server.crt"
  tls_key_file:  "certs/server.key"
  # tls_ca_file: "certs/ca.crt"   # uncomment for mTLS
  read_timeout:  "30s"
  write_timeout: "30s"
  max_batch_size: 1000

database:
  host:     "timescaledb"   # Docker service name - do not change when using compose
  port:     5432
  name:     "obsidianwatch"
  user:     "obsidianwatch"
  password: "changeme"      # ← MUST MATCH POSTGRES_PASSWORD in docker-compose.yml
  ssl_mode: "disable"
  max_open_conns:    25
  max_idle_conns:    10
  conn_max_lifetime: "5m"

auth:
  # Generate a strong key: openssl rand -hex 32
  # Paste the same value into agent.yaml forwarder.api_key
  api_keys:
    - "changeme-generate-a-real-key-with-openssl-rand-hex-32"
  mtls_enabled: false

  # Agent identity (spec A1-A4). Agents enroll with a token from the console
  # (Settings > Agent enrollment) and then use a per-agent certificate.
  #   legacy   - fleet api_key on every route (behaviour before enrollment)
  #   mixed    - certificate when presented, fleet key still accepted (default)
  #   enforced - certificate required; fleet key only on /api/v1/enroll
  agent_identity:
    mode: "mixed"
    ca_cert_file: "agent-ca/agent-ca.crt"   # created on first start
    ca_key_file:  "agent-ca/agent-ca.key"   # 0600; back it up with the volume
    cert_ttl: "720h"                        # 30 days; agents renew at half life
    allow_fleet_key_enrollment: false       # migration aid for existing installs

log:
  level:  "info"
  format: "json"
