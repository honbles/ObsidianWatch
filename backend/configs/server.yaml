server:
  # Address and port to listen on.
  listen_addr: ":8443"

  # TLS - required. Certificates are generated automatically by cert-init (see README.md)
  tls_cert_file: "certs/server.crt"
  tls_key_file:  "certs/server.key"

  # Only needed for mTLS (when agents connect with client certificates).
  # tls_ca_file: "certs/ca.crt"

  read_timeout:  "30s"
  write_timeout: "30s"

  # Maximum events the backend will accept in a single POST from an agent.
  max_batch_size: 1000

database:
  host:     "timescaledb"   # Docker service name
  port:     5432
  name:     "obsidianwatch"
  user:     "obsidianwatch"
  password: "changeme"      # CHANGE THIS - also update docker-compose.yml
  ssl_mode: "disable"       # Use "require" in production with a real DB cert

  max_open_conns:     25
  max_idle_conns:     10
  conn_max_lifetime:  "5m"

auth:
  # List of accepted API keys (X-API-Key header from agents).
  # Generate with: openssl rand -hex 32
  api_keys:
    - "changeme-generate-a-real-key-with-openssl-rand-hex-32"

  # Set to true to require agent client certificates instead of API keys.
  # Also set server.tls_ca_file when enabling this.
  mtls_enabled: false

  # Agents authenticate with their own certificate (spec A1-A4); there is no
  # shared API key. The Agent builder embeds an enrollment token; on first
  # start the agent enrolls at /api/v1/enroll and gets a 30-day certificate.
  agent_identity:
    ca_cert_file: "agent-ca/agent-ca.crt"   # created on first start
    ca_key_file:  "agent-ca/agent-ca.key"   # 0600; back it up with the volume
    cert_ttl: "720h"                        # 30 days; agents renew at half life

# Live-response tunnels ride on this port: agents connect here (same
# certificate as ingest) and the WebSocket is passed to the management API.
tunnel:
  management_url: ""                       # e.g. "https://mgmt-api:8443"; empty = off
  management_ca_file: "certs/ca.crt"      # deployment CA from cert-init
  management_server_name: "127.0.0.1"     # a SAN of the cert-init server certificate
  insecure_skip_verify: false

log:
  level:  "info"    # debug | info | warn | error
  format: "json"    # json | text
